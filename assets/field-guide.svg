<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="244" viewBox="0 0 1200 244" role="img" aria-labelledby="title desc">
  <title id="title">The Practical AI Guide</title>
  <desc id="desc">An open playbook from a better question to a working project. Seventeen chapters, five labs, and reusable templates, with floating violet glass pages.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1e1037"/><stop offset="1" stop-color="#110b20"/></linearGradient>
    <linearGradient id="page" x2="1" y2="1"><stop stop-color="#c896ff" stop-opacity=".5"/><stop offset="1" stop-color="#773cd4" stop-opacity=".2"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#923cff" stop-opacity=".3"/><stop offset="1" stop-color="#923cff" stop-opacity="0"/></radialGradient>
    <style>.sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'Courier New',monospace}.pages{animation:float 6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(-4px)}50%{transform:translateY(4px)}}@media(prefers-reduced-motion:reduce){.pages{animation:none!important}}</style>
  </defs>
  <rect x=".5" y=".5" width="1199" height="243" rx="20" fill="url(#bg)" stroke="#70459c"/>
  <ellipse cx="1034" cy="122" rx="164" ry="121" fill="url(#aura)"/>
  <rect x="34" y="38" width="4" height="165" rx="2" fill="#b37bff"/>
  <text x="62" y="53" class="mono" font-size="13" letter-spacing="2" fill="#c19bec">THE OPEN PLAYBOOK / AI-GUIDE</text>
  <text x="60" y="110" class="sans" font-size="49" font-weight="700" letter-spacing="-1.8" fill="#f5edff">The Practical AI Guide</text>
  <text x="62" y="147" class="sans" font-size="21" fill="#c7b5dd">From a better question to a working project.</text>
  <g class="mono" font-size="13" fill="#d7baff">
    <rect x="62" y="173" width="140" height="31" rx="8" fill="#ac70ff" fill-opacity=".1"/><text x="77" y="193">17 CHAPTERS</text>
    <rect x="214" y="173" width="94" height="31" rx="8" fill="#ac70ff" fill-opacity=".1"/><text x="229" y="193">5 LABS</text>
    <rect x="320" y="173" width="200" height="31" rx="8" fill="#ac70ff" fill-opacity=".1"/><text x="335" y="193">REUSABLE TEMPLATES</text>
  </g>
