<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">RepoEnjoyer</title>
  <desc id="desc">A centered light banner for a vibe coder and tool builder, featuring The Practical AI Guide.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBFAFF"/><stop offset=".5" stop-color="#EFF8FF"/><stop offset="1" stop-color="#EDFCF7"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#111827"/><stop offset=".38" stop-color="#6D28D9"/><stop offset=".68" stop-color="#0E7490"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7C3AED"/><stop offset=".5" stop-color="#0891B2"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#475569" stroke-opacity=".06"/></pattern>
    <radialGradient id="glow"><stop stop-color="#06B6D4" stop-opacity=".14"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="28" fill="url(#grid)"/>
  <circle cx="600" cy="190" r="310" fill="url(#glow)"/>
  <g opacity=".5" stroke="url(#accent)" fill="none"><path d="M90 52H390"/><path d="M810 52H1110"/><path d="M90 52v18M1110 52v18"/><circle cx="390" cy="52" r="3" fill="#7C3AED"/><circle cx="810" cy="52" r="3" fill="#059669"/></g>
  <g>
    <rect x="438" y="28" width="324" height="48" rx="24" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity=".6"/>
    <text x="600" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.2" fill="#6D28D9">VIBE CODER · TOOL BUILDER</text>
  </g>
  <text x="600" y="177" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="92" font-weight="900" letter-spacing="-4" fill="url(#word)">RepoEnjoyer</text>
  <text x="600" y="219" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#334155">I turn rough ideas into useful software—then teach the method.</text>
  <rect x="330" y="246" width="540" height="3" rx="1.5" fill="url(#accent)"/>
  <g transform="translate(275 273)">
    <rect width="650" height="70" rx="16" fill="#FFFFFF" stroke="#0891B2" stroke-opacity=".4"/>
    <g transform="translate(24 13)"><rect width="44" height="44" rx="12" fill="#7C3AED" fill-opacity=".1" stroke="#7C3AED"/><text x="22" y="29" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" fill="#6D28D9">AI</text></g>
    <text x="86" y="29" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#0E7490">TOP PROJECT</text>
    <text x="86" y="52" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#111827">The Practical AI Guide · learn to vibe code</text>
    <text x="620" y="43" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#059669">→</text>
  </g>
  <g transform="translate(150 373)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <g><rect width="250" height="46" rx="13" fill="#F5F3FF" stroke="#7C3AED" stroke-opacity=".45"/><text x="125" y="29" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6D28D9">PROMPT → PROJECT</text></g>
    <g transform="translate(325)"><rect width="250" height="46" rx="13" fill="#ECFEFF" stroke="#0891B2" stroke-opacity=".45"/><text x="125" y="29" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#0E7490">LOCAL → PRIVATE</text></g>
    <g transform="translate(650)"><rect width="250" height="46" rx="13" fill="#ECFDF5" stroke="#059669" stroke-opacity=".45"/><text x="125" y="29" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#047857">BUILD → PROVE → SHIP</text></g>
