<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">The RepoEnjoyer project constellation</title>
  <desc id="desc">Four connected groups show trust tools, creation tools, learning resources, and playful experiments.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#10182C"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A78BFA"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#34D399"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <g stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="5 7">
    <path d="M600 244L275 128M600 244L925 128M600 244L275 368M600 244L925 368"/>
  </g>
  <g transform="translate(600 244)" filter="url(#shadow)">
    <circle r="82" fill="#111827" stroke="url(#line)" stroke-width="3"/>
    <circle r="67" fill="none" stroke="#475569"/>
    <text text-anchor="middle" y="-8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="800" fill="#F8FAFC">THE</text>
    <text text-anchor="middle" y="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="800" fill="#F8FAFC">WORKSHOP</text>
    <text text-anchor="middle" y="45" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="2" fill="#94A3B8">USEFUL BY DESIGN</text>
  </g>

  <g transform="translate(70 45)" filter="url(#shadow)">
    <rect width="410" height="166" rx="18" fill="#151329" stroke="#8B5CF6" stroke-opacity=".65"/>
    <text x="24" y="34" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#C4B5FD">01 / TRUST LAYER</text>
    <text x="24" y="63" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#CBD5E1">Turn unknown risk into inspectable evidence.</text>
    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
      <g transform="translate(24 88)"><rect width="104" height="44" rx="10" fill="#221D3E"/><text x="52" y="27" text-anchor="middle" fill="#EDE9FE">LeakFence</text></g>
      <g transform="translate(139 88)"><rect width="112" height="44" rx="10" fill="#221D3E"/><text x="56" y="27" text-anchor="middle" fill="#EDE9FE">InstallGlass</text></g>
      <g transform="translate(262 88)"><rect width="120" height="44" rx="10" fill="#221D3E"/><text x="60" y="27" text-anchor="middle" fill="#EDE9FE">RepoMend</text></g>
    </g>
  </g>

  <g transform="translate(720 45)" filter="url(#shadow)">
    <rect width="410" height="166" rx="18" fill="#09242A" stroke="#22D3EE" stroke-opacity=".65"/>
    <text x="24" y="34" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#67E8F9">02 / CREATE &amp; SHIP</text>
    <text x="24" y="63" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#CBD5E1">Give ambitious work a calmer path to done.</text>
    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
      <g transform="translate(24 88)"><rect width="120" height="44" rx="10" fill="#10353D"/><text x="60" y="27" text-anchor="middle" fill="#CFFAFE">CreatorDock</text></g>
      <g transform="translate(155 88)"><rect width="104" height="44" rx="10" fill="#10353D"/><text x="52" y="27" text-anchor="middle" fill="#CFFAFE">FormMint</text></g>
      <g transform="translate(270 88)"><rect width="112" height="44" rx="10" fill="#10353D"/><text x="56" y="27" text-anchor="middle" fill="#CFFAFE">OverlayKit</text></g>
    </g>
  </g>

  <g transform="translate(70 288)" filter="url(#shadow)">
    <rect width="410" height="166" rx="18" fill="#09251D" stroke="#34D399" stroke-opacity=".65"/>
    <text x="24" y="34" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#6EE7B7">03 / LEARN &amp; ENABLE</text>
    <text x="24" y="63" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#CBD5E1">Make powerful ideas easier to use well.</text>
    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
      <g transform="translate(24 88)"><rect width="102" height="44" rx="10" fill="#123A2E"/><text x="51" y="27" text-anchor="middle" fill="#D1FAE5">AI Guide</text></g>
      <g transform="translate(137 88)"><rect width="116" height="44" rx="10" fill="#123A2E"/><text x="58" y="27" text-anchor="middle" fill="#D1FAE5">AI for School</text></g>
      <g transform="translate(264 88)"><rect width="118" height="44" rx="10" fill="#123A2E"/><text x="59" y="27" text-anchor="middle" fill="#D1FAE5">VoxLocal</text></g>
    </g>
  </g>

  <g transform="translate(720 288)" filter="url(#shadow)">
    <rect width="410" height="166" rx="18" fill="#29190D" stroke="#FB923C" stroke-opacity=".65"/>
    <text x="24" y="34" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#FDBA74">04 / UTILITY &amp; PLAY</text>
    <text x="24" y="63" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#CBD5E1">Stay curious. Build the useful weird thing.</text>
    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
      <g transform="translate(72 88)"><rect width="120" height="44" rx="10" fill="#3B2413"/><text x="60" y="27" text-anchor="middle" fill="#FFEDD5">DirChord</text></g>
      <g transform="translate(216 88)"><rect width="120" height="44" rx="10" fill="#3B2413"/><text x="60" y="27" text-anchor="middle" fill="#FFEDD5">Grimwick</text></g>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="498" rx="23" fill="none" stroke="#334155"/>
</svg>
