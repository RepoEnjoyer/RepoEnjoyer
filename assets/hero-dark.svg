<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">RepoEnjoyer</title>
  <desc id="desc">A dark technical workshop banner with project nodes orbiting a central RE monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A14"/>
      <stop offset="0.48" stop-color="#11122A"/>
      <stop offset="1" stop-color="#07161C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9CA3AF" stroke-opacity=".08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1040" cy="75" r="220" fill="url(#orb)"/>
  <circle cx="120" cy="390" r="230" fill="url(#orb)" opacity=".5"/>
  <path d="M0 352C212 288 325 385 540 318S902 249 1200 331" fill="none" stroke="url(#accent)" stroke-opacity=".22" stroke-width="2"/>
  <path d="M0 368C215 306 338 402 548 335S910 269 1200 349" fill="none" stroke="url(#accent)" stroke-opacity=".1"/>

  <g transform="translate(72 24)">
    <rect width="132" height="30" rx="15" fill="#A78BFA" fill-opacity=".13" stroke="#A78BFA" stroke-opacity=".45"/>
    <circle cx="17" cy="15" r="4" fill="#34D399" filter="url(#glow)"/>
    <text x="30" y="20" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.4" fill="#D8B4FE">WORKSHOP LIVE</text>
  </g>

  <g transform="translate(72 132)">
    <text font-family="Inter, Segoe UI, Arial, sans-serif" font-size="78" font-weight="850" letter-spacing="-3" fill="#F8FAFC">Repo<tspan fill="url(#accent)">Enjoyer</tspan></text>
    <text y="51" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" letter-spacing="3" fill="#94A3B8">BUILD  /  INSPECT  /  EXPLAIN  /  SHIP</text>
    <rect y="84" width="570" height="3" rx="1.5" fill="url(#accent)"/>
    <text y="127" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#CBD5E1">Privacy-first tools. Calm interfaces. Practical knowledge.</text>
    <text y="158" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#CBD5E1">Software with evidence, escape hatches, and a little personality.</text>
  </g>

  <g transform="translate(930 204)">
    <circle r="92" fill="none" stroke="#22D3EE" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="5 9"/>
    <circle r="62" fill="#0B1220" stroke="url(#accent)" stroke-width="3"/>
    <circle r="48" fill="none" stroke="#A78BFA" stroke-opacity=".25"/>
    <text text-anchor="middle" y="12" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="-2" fill="#F8FAFC">RE</text>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" fill="#E2E8F0">
      <g transform="translate(-104 -60)"><circle r="17" fill="#17142C" stroke="#A78BFA"/><text text-anchor="middle" y="4">SAFE</text></g>
      <g transform="translate(104 -58)"><circle r="17" fill="#09242A" stroke="#22D3EE"/><text text-anchor="middle" y="4">LOCAL</text></g>
      <g transform="translate(105 62)"><circle r="17" fill="#09231D" stroke="#34D399"/><text text-anchor="middle" y="4">CLEAR</text></g>
      <g transform="translate(-105 62)"><circle r="17" fill="#291A0C" stroke="#FB923C"/><text text-anchor="middle" y="4">PLAY</text></g>
    </g>
  </g>

  <g transform="translate(72 359)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1.1">
    <text fill="#64748B">SYSTEM STATUS</text>
    <text x="112" fill="#34D399">● CREATING</text>
    <text x="228" fill="#22D3EE">● CURIOUS</text>
    <text x="332" fill="#A78BFA">● OPEN SOURCE</text>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#A78BFA" stroke-opacity=".2" stroke-width="2"/>
</svg>
