<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">RepoEnjoyer</title>
  <desc id="desc">A centered dark banner for a vibe coder and tool builder, with layered purple rain and The Practical AI Guide.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070913"/><stop offset=".5" stop-color="#11122A"/><stop offset="1" stop-color="#071A1D"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F8FAFC"/><stop offset=".38" stop-color="#C4B5FD"/><stop offset=".68" stop-color="#67E8F9"/><stop offset="1" stop-color="#6EE7B7"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A78BFA"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#34D399"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#94A3B8" stroke-opacity=".065"/></pattern>
    <radialGradient id="glow"><stop stop-color="#22D3EE" stop-opacity=".22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="rainMist"><stop stop-color="#8B5CF6" stop-opacity=".2"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <linearGradient id="rainFar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#DDD6FE" stop-opacity="0"/><stop offset=".35" stop-color="#C4B5FD" stop-opacity=".45"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient>
    <linearGradient id="rainNear" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F5F3FF" stop-opacity="0"/><stop offset=".28" stop-color="#DDD6FE" stop-opacity=".9"/><stop offset=".72" stop-color="#A78BFA" stop-opacity=".75"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></linearGradient>
    <clipPath id="heroClip"><rect width="1200" height="460" rx="28"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="rainGlow" x="-100%" y="-30%" width="300%" height="160%"><feGaussianBlur stdDeviation="1.8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .trace { stroke-dasharray: 10 13; animation: trace 9s linear infinite; }
      .breath { animation: breath 5s ease-in-out infinite; }
      .pulse-border { animation: borderPulse 3.6s ease-in-out infinite; }
      .guide-card { animation: guidePulse 4.2s ease-in-out infinite; }
      .runner { animation: runner 5s ease-in-out infinite; }
      .guide-arrow { animation: nudge 1.8s ease-in-out infinite; }
      .chip { animation: chipGlow 6s ease-in-out infinite; }
      .chip-b { animation-delay: 1s; }
      .chip-c { animation-delay: 2s; }
      .rain-drop { stroke-linecap: round; vector-effect: non-scaling-stroke; }
      .drop-far { animation: rainFarFall 4.2s linear infinite; }
      .drop-mid { animation: rainMidFall 2.8s linear infinite; }
      .drop-near { animation: rainNearFall 1.75s linear infinite; }
      .rain-mist { animation: mistBreath 6s ease-in-out infinite; }
      .rain-splash { transform-box: fill-box; transform-origin: center; animation: splash 2.8s ease-out infinite; }
      @keyframes trace { to { stroke-dashoffset: -92; } }
      @keyframes breath { 0%, 100% { opacity: .62; } 50% { opacity: 1; } }
      @keyframes borderPulse { 0%, 100% { stroke-opacity: .5; } 50% { stroke-opacity: 1; } }
      @keyframes guidePulse { 0%, 100% { stroke-opacity: .32; } 50% { stroke-opacity: .8; } }
      @keyframes runner { 0% { transform: translateX(0); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateX(540px); opacity: 0; } }
      @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(7px); } }
      @keyframes chipGlow { 0%, 100% { stroke-opacity: .35; } 18% { stroke-opacity: .95; } 36% { stroke-opacity: .35; } }
      @keyframes rainFarFall { from { transform: translate3d(10px, -510px, 0); } to { transform: translate3d(-10px, 510px, 0); } }
      @keyframes rainMidFall { from { transform: translate3d(14px, -510px, 0); } to { transform: translate3d(-14px, 510px, 0); } }
      @keyframes rainNearFall { from { transform: translate3d(18px, -540px, 0); } to { transform: translate3d(-18px, 540px, 0); } }
      @keyframes mistBreath { 0%, 100% { opacity: .35; transform: scaleX(.96); } 50% { opacity: .72; transform: scaleX(1.05); } }
      @keyframes splash { 0%, 66% { opacity: 0; transform: scaleX(.18) scaleY(.5); } 72% { opacity: .65; } 100% { opacity: 0; transform: scaleX(1.7) scaleY(1.15); } }
      @media (prefers-reduced-motion: reduce) { .trace, .breath, .pulse-border, .guide-card, .runner, .guide-arrow, .chip, .rain-drop, .rain-mist, .rain-splash { animation: none !important; } .rain-field { opacity: .16; } .rain-splash { display: none; } }
    </style>
  </defs>
  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="28" fill="url(#grid)"/>
  <g class="rain-field" clip-path="url(#heroClip)" aria-hidden="true" pointer-events="none">
    <ellipse class="rain-mist" cx="190" cy="20" rx="280" ry="125" fill="url(#rainMist)"/>
    <ellipse class="rain-mist" cx="1010" cy="442" rx="330" ry="105" fill="url(#rainMist)" style="animation-delay:-3s"/>

    <g opacity=".28" stroke="url(#rainFar)" stroke-width="1">
      <path class="rain-drop drop-far" d="M42 26l-5 28" style="animation-delay:-.3s"/>
      <path class="rain-drop drop-far" d="M112 186l-5 31" style="animation-delay:-2.8s"/>
      <path class="rain-drop drop-far" d="M177 348l-4 25" style="animation-delay:-1.4s"/>
      <path class="rain-drop drop-far" d="M246 98l-5 30" style="animation-delay:-3.7s"/>
      <path class="rain-drop drop-far" d="M315 414l-4 24" style="animation-delay:-.8s"/>
      <path class="rain-drop drop-far" d="M382 246l-5 29" style="animation-delay:-2.1s"/>
      <path class="rain-drop drop-far" d="M451 64l-4 25" style="animation-delay:-3.2s"/>
      <path class="rain-drop drop-far" d="M518 318l-5 31" style="animation-delay:-1.1s"/>
      <path class="rain-drop drop-far" d="M587 155l-4 26" style="animation-delay:-2.6s"/>
      <path class="rain-drop drop-far" d="M654 397l-5 29" style="animation-delay:-.1s"/>
      <path class="rain-drop drop-far" d="M723 218l-4 25" style="animation-delay:-3.5s"/>
      <path class="rain-drop drop-far" d="M791 42l-5 31" style="animation-delay:-1.7s"/>
      <path class="rain-drop drop-far" d="M858 365l-4 26" style="animation-delay:-2.9s"/>
      <path class="rain-drop drop-far" d="M927 126l-5 29" style="animation-delay:-.6s"/>
      <path class="rain-drop drop-far" d="M995 284l-4 24" style="animation-delay:-2.3s"/>
      <path class="rain-drop drop-far" d="M1064 78l-5 30" style="animation-delay:-3.9s"/>
      <path class="rain-drop drop-far" d="M1134 399l-4 26" style="animation-delay:-1.9s"/>
      <path class="rain-drop drop-far" d="M1180 235l-5 31" style="animation-delay:-.9s"/>
    </g>

    <g opacity=".43" stroke="#A78BFA" stroke-width="1.35">
      <path class="rain-drop drop-mid" d="M75 352l-8 43" style="animation-delay:-1.8s"/>
      <path class="rain-drop drop-mid" d="M168 112l-8 47" style="animation-delay:-.4s"/>
      <path class="rain-drop drop-mid" d="M272 274l-7 40" style="animation-delay:-2.5s"/>
      <path class="rain-drop drop-mid" d="M364 30l-8 45" style="animation-delay:-1.1s"/>
      <path class="rain-drop drop-mid" d="M470 404l-7 41" style="animation-delay:-2.1s"/>
      <path class="rain-drop drop-mid" d="M566 201l-8 48" style="animation-delay:-.7s"/>
      <path class="rain-drop drop-mid" d="M666 82l-7 42" style="animation-delay:-2.7s"/>
      <path class="rain-drop drop-mid" d="M760 325l-8 46" style="animation-delay:-1.5s"/>
      <path class="rain-drop drop-mid" d="M858 165l-7 41" style="animation-delay:-.2s"/>
      <path class="rain-drop drop-mid" d="M956 426l-8 47" style="animation-delay:-2.3s"/>
      <path class="rain-drop drop-mid" d="M1054 245l-7 42" style="animation-delay:-.9s"/>
      <path class="rain-drop drop-mid" d="M1152 54l-8 48" style="animation-delay:-2.6s"/>
    </g>

    <g opacity=".62" stroke="url(#rainNear)" stroke-width="2" filter="url(#rainGlow)">
      <path class="rain-drop drop-near" d="M135 238l-12 68" style="animation-delay:-1.2s"/>
      <path class="rain-drop drop-near" d="M302 418l-11 64" style="animation-delay:-.35s"/>
      <path class="rain-drop drop-near" d="M438 96l-12 72" style="animation-delay:-1.62s"/>
      <path class="rain-drop drop-near" d="M612 310l-11 66" style="animation-delay:-.76s"/>
      <path class="rain-drop drop-near" d="M786 28l-12 72" style="animation-delay:-1.43s"/>
      <path class="rain-drop drop-near" d="M948 382l-11 65" style="animation-delay:-.15s"/>
      <path class="rain-drop drop-near" d="M1108 176l-12 70" style="animation-delay:-1.01s"/>
    </g>

    <g fill="none" stroke="#C4B5FD" stroke-width="1.25" opacity=".42">
      <ellipse class="rain-splash" cx="130" cy="442" rx="18" ry="4" style="animation-delay:-1.1s"/>
      <ellipse class="rain-splash" cx="352" cy="442" rx="16" ry="3.5" style="animation-delay:-2.35s"/>
      <ellipse class="rain-splash" cx="601" cy="442" rx="20" ry="4" style="animation-delay:-.45s"/>
      <ellipse class="rain-splash" cx="846" cy="442" rx="17" ry="3.5" style="animation-delay:-1.8s"/>
      <ellipse class="rain-splash" cx="1072" cy="442" rx="19" ry="4" style="animation-delay:-2.7s"/>
    </g>
  </g>
  <circle class="breath" cx="600" cy="190" r="310" fill="url(#glow)"/>
  <circle cx="115" cy="72" r="58" fill="#8B5CF6" opacity=".08" filter="url(#soft)"/>
  <circle cx="1085" cy="382" r="68" fill="#34D399" opacity=".08" filter="url(#soft)"/>

  <g class="trace" opacity=".6" stroke="url(#accent)" fill="none">
    <path d="M90 52H390"/><path d="M810 52H1110"/>
    <path d="M90 52v18M1110 52v18"/>
    <circle cx="390" cy="52" r="3" fill="#A78BFA"/><circle cx="810" cy="52" r="3" fill="#34D399"/>
  </g>

  <g>
    <rect class="pulse-border" x="438" y="28" width="324" height="48" rx="24" fill="#111827" stroke="#8B5CF6" stroke-opacity=".75"/>
    <text x="600" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.2" fill="#E9D5FF">VIBE CODER · TOOL BUILDER</text>
  </g>

  <text x="600" y="177" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="92" font-weight="900" letter-spacing="-4" fill="url(#word)">RepoEnjoyer</text>
  <text x="600" y="219" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#CBD5E1">I turn rough ideas into useful software, then teach the method.</text>
  <rect x="330" y="246" width="540" height="3" rx="1.5" fill="url(#accent)"/>
  <circle class="runner" cx="330" cy="247.5" r="4" fill="#F8FAFC" filter="url(#dotGlow)"/>

  <g transform="translate(275 273)">
    <rect class="guide-card" width="650" height="70" rx="16" fill="#0C1423" stroke="#22D3EE" stroke-opacity=".4"/>
    <g transform="translate(24 13)">
      <rect width="44" height="44" rx="12" fill="#8B5CF6" fill-opacity=".18" stroke="#A78BFA"/>
      <text x="22" y="29" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" fill="#DDD6FE">AI</text>
    </g>
    <text x="86" y="29" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#67E8F9">TOP PROJECT</text>
    <text x="86" y="52" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#F8FAFC">The Practical AI Guide · learn to vibe code</text>
    <text class="guide-arrow" x="620" y="43" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#34D399">→</text>
  </g>

  <g transform="translate(150 373)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <g><rect class="chip chip-a" width="250" height="46" rx="13" fill="#17142C" stroke="#8B5CF6" stroke-opacity=".5"/><text x="125" y="29" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#C4B5FD">PROMPT → PROJECT</text></g>
    <g transform="translate(325)"><rect class="chip chip-b" width="250" height="46" rx="13" fill="#09242A" stroke="#22D3EE" stroke-opacity=".5"/><text x="125" y="29" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#67E8F9">LOCAL → PRIVATE</text></g>
    <g transform="translate(650)"><rect class="chip chip-c" width="250" height="46" rx="13" fill="#09251D" stroke="#34D399" stroke-opacity=".5"/><text x="125" y="29" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6EE7B7">BUILD → PROVE → SHIP</text></g>
  </g>
  <rect x="1" y="1" width="1198" height="458" rx="27" fill="none" stroke="#8B5CF6" stroke-opacity=".25" stroke-width="2"/>
</svg>
