<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="title desc">
  <title id="title">The RepoEnjoyer build loop</title>
  <desc id="desc">Idea to prompt to prototype to proof to ship.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#171329"/><stop offset=".5" stop-color="#09242A"/><stop offset="1" stop-color="#09251D"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A78BFA"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#34D399"/></linearGradient></defs>
  <rect width="1200" height="170" rx="22" fill="url(#bg)"/>
  <text x="600" y="42" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="3" fill="#94A3B8">THE REPOENJOYER LOOP</text>
  <g transform="translate(80 70)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC">
    <g><rect width="140" height="50" rx="25" fill="#8B5CF6"/><text x="70" y="31" text-anchor="middle">IDEA</text></g><path d="M150 25h60" stroke="#A78BFA" stroke-width="2"/><path d="M204 19l10 6-10 6" fill="#A78BFA"/>
    <g transform="translate(220)"><rect width="140" height="50" rx="25" fill="#7C7BF2"/><text x="70" y="31" text-anchor="middle">PROMPT</text></g><path d="M370 25h60" stroke="#7C7BF2" stroke-width="2"/><path d="M424 19l10 6-10 6" fill="#7C7BF2"/>
    <g transform="translate(440)"><rect width="140" height="50" rx="25" fill="#0891B2"/><text x="70" y="31" text-anchor="middle">PROTOTYPE</text></g><path d="M590 25h60" stroke="#22D3EE" stroke-width="2"/><path d="M644 19l10 6-10 6" fill="#22D3EE"/>
    <g transform="translate(660)"><rect width="140" height="50" rx="25" fill="#0D9F7C"/><text x="70" y="31" text-anchor="middle">PROOF</text></g><path d="M810 25h60" stroke="#34D399" stroke-width="2"/><path d="M864 19l10 6-10 6" fill="#34D399"/>
    <g transform="translate(880)"><rect width="140" height="50" rx="25" fill="#059669"/><text x="70" y="31" text-anchor="middle">SHIP</text></g>
  </g>
  <text x="600" y="146" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#CBD5E1">Build fast enough to stay excited. Verify enough to stay proud.</text>
  <rect x="1" y="1" width="1198" height="168" rx="21" fill="none" stroke="url(#line)" stroke-opacity=".5" stroke-width="2"/>
</svg>
