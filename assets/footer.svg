<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">RepoEnjoyer build motto</title>
  <desc id="desc">Make it useful. Make it safe. Make it understandable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#171329"/><stop offset=".5" stop-color="#09242A"/><stop offset="1" stop-color="#09251D"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#A78BFA"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#34D399"/></linearGradient>
  </defs>
  <rect width="1200" height="150" rx="22" fill="url(#bg)"/>
  <path d="M65 32H1135" stroke="url(#line)" stroke-width="2" opacity=".7"/>
  <circle cx="65" cy="32" r="5" fill="#A78BFA"/><circle cx="600" cy="32" r="5" fill="#22D3EE"/><circle cx="1135" cy="32" r="5" fill="#34D399"/>
  <text x="600" y="91" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="800" fill="#F8FAFC">MAKE IT USEFUL.  MAKE IT SAFE.  MAKE IT UNDERSTANDABLE.</text>
  <text x="600" y="120" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="2.4" fill="#94A3B8">THE REPOENJOYER WORKSHOP</text>
  <rect x="1" y="1" width="1198" height="148" rx="21" fill="none" stroke="#334155"/>
</svg>
