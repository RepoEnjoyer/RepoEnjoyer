<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">RepoEnjoyer | Build with curiosity. Think in systems.</title>
  <desc id="desc">A neon violet identity with an animated energy field, flowing light trails, and a luminous geometric core. Open source, privacy tools, and practical AI.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#130925"/><stop offset=".55" stop-color="#100a20"/><stop offset="1" stop-color="#241044"/></linearGradient>
    <linearGradient id="word" x1="0" x2="1" y1="0" y2=".5"><stop stop-color="#ffffff"/><stop offset=".5" stop-color="#e6d4ff"/><stop offset="1" stop-color="#ac70ff"/></linearGradient>
    <linearGradient id="flow"><stop stop-color="#7137cb" stop-opacity="0"/><stop offset=".45" stop-color="#a15eff"/><stop offset=".8" stop-color="#e6b4ff"/><stop offset="1" stop-color="#9557ff" stop-opacity="0"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#933bff" stop-opacity=".45"/><stop offset=".55" stop-color="#7930d6" stop-opacity=".15"/><stop offset="1" stop-color="#7930d6" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".65" fill="#c799ff" opacity=".16"/></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1200" height="380" rx="22"/></clipPath>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'Courier New',monospace}
      .flow{stroke-dasharray:100 900;animation:flow 8s linear infinite}.flow-b{animation-delay:-4s}
      .float{animation:float 8s ease-in-out infinite}.aura{animation:breath 7s ease-in-out infinite}
      .ring{transform-origin:1016px 176px;animation:spin 28s linear infinite}
      .star{animation:twinkle 5s ease-in-out infinite}.star-b{animation-delay:-2.5s}
      @keyframes flow{to{stroke-dashoffset:-1000}}
      @keyframes float{0%,100%{transform:translateY(-5px)}50%{transform:translateY(5px)}}
      @keyframes breath{0%,100%{opacity:.65}50%{opacity:1}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.flow,.float,.aura,.ring,.star{animation:none!important}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#dots)"/>
    <ellipse cx="1016" cy="176" rx="310" ry="280" fill="url(#aura)" class="aura"/>
    <ellipse cx="334" cy="395" rx="450" ry="180" fill="url(#aura)" opacity=".5"/>
    <g fill="none" stroke="url(#flow)">
      <path d="M628 -75C890 40 831 320 1129 344S1373 182 1210 75" opacity=".3"/>
      <path d="M650 -75C912 40 853 320 1151 344S1395 182 1232 75" opacity=".35"/>
      <path d="M672 -75C934 40 875 320 1173 344S1417 182 1254 75" opacity=".4"/>
      <path d="M694 -75C956 40 897 320 1195 344S1439 182 1276 75" opacity=".5"/>
      <path d="M716 -75C978 40 919 320 1217 344S1461 182 1298 75" opacity=".5"/>
      <path d="M650 -75C912 40 853 320 1151 344S1395 182 1232 75" stroke-width="2" class="flow"/>
      <path d="M694 -75C956 40 897 320 1195 344S1439 182 1276 75" stroke-width="2" class="flow flow-b"/>
    </g>
    <rect x="48" y="38" width="247" height="30" rx="15" fill="#a574ff" fill-opacity=".09" stroke="#a574ff" stroke-opacity=".3"/>
    <circle cx="66" cy="53" r="3.5" fill="#c59aff" class="star"/>
    <text x="80" y="58" class="mono" fill="#d1aeff" font-size="12" letter-spacing="1.5">EXPERIMENTAL BY DEFAULT</text>
    <text x="44" y="179" class="sans" font-size="103" font-weight="700" letter-spacing="-6" fill="url(#word)">RepoEnjoyer<tspan fill="#b279ff">.</tspan></text>
    <text x="50" y="228" class="sans" font-size="25" fill="#d3c6e6">Build with curiosity. Think in systems.</text>
    <g class="float">
      <circle cx="1016" cy="176" r="90" fill="#150b29" fill-opacity=".5" stroke="#aa70ff" stroke-opacity=".3"/>
      <circle cx="1016" cy="176" r="104" fill="none" stroke="#cda8ff" stroke-opacity=".4" stroke-dasharray="2 12"/>
      <g class="ring" fill="none" stroke="#b67bff">
        <circle cx="1016" cy="176" r="90" stroke-width="2" stroke-dasharray="90 476"/>
        <circle cx="1106" cy="176" r="4" fill="#e4caff" stroke="none"/>
      </g>
      <path d="M1016 111 1072 143V208L1016 241 960 208V143Z" fill="#b578ff" fill-opacity=".07" stroke="#d4afff" stroke-width="1.5"/>
      <path d="M960 143 1016 176 1072 143M1016 176V241M1016 111V176L960 208M1016 176 1072 208" fill="none" stroke="#b881ff"/>
      <path d="M995 164 981 176 995 188M1037 164 1051 176 1037 188M1022 158 1010 194" fill="none" stroke="#f0ddff" stroke-width="2.5" filter="url(#glow)"/>
    </g>
    <g fill="#e7ccff"><path d="M1132 73v12m-6-6h12" stroke="#d3a6ff" class="star"/><circle cx="853" cy="73" r="2" class="star star-b"/><circle cx="1134" cy="259" r="2" class="star"/></g>
    <path d="M49 272H762" stroke="#a675ee" stroke-opacity=".2"/>
    <g class="mono" font-size="13" letter-spacing="1.2" fill="#cbb7e8">
      <rect x="49" y="295" width="157" height="35" rx="9" fill="#b478ff" fill-opacity=".08" stroke="#b478ff" stroke-opacity=".2"/>
      <text x="67" y="317">OPEN SOURCE</text>
      <rect x="218" y="295" width="182" height="35" rx="9" fill="#b478ff" fill-opacity=".08" stroke="#b478ff" stroke-opacity=".2"/>
      <text x="236" y="317">PRIVACY TOOLS</text>
      <rect x="412" y="295" width="177" height="35" rx="9" fill="#b478ff" fill-opacity=".08" stroke="#b478ff" stroke-opacity=".2"/>
      <text x="430" y="317">PRACTICAL AI</text>
    </g>
    <rect x=".5" y=".5" width="1199" height="379" rx="22" fill="none" stroke="#aa73f0" stroke-opacity=".28"/>
  </g>
</svg>
