<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">RepoEnjoyer | Independent systems lab</title>
  <desc id="desc">An editorial lab identity in ink, warm white, copper, and mint. Orbital traces rotate around a geometric core. Find the hidden mechanism. Build something useful.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#25333a" stroke-width=".6"/></pattern>
    <radialGradient id="halo"><stop stop-color="#1f4544" stop-opacity=".6"/><stop offset="1" stop-color="#10191e" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1200" height="440" rx="16"/></clipPath>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'Courier New',monospace}
      .orbit{transform-origin:938px 204px;animation:orbit 36s linear infinite}
      .reverse{transform-origin:938px 204px;animation:orbit 48s linear infinite reverse}
      .signal{stroke-dasharray:7 17;animation:signal 12s linear infinite}
      .pulse{animation:pulse 5s ease-in-out infinite}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @keyframes signal{to{stroke-dashoffset:-144}}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.orbit,.reverse,.signal,.pulse{animation:none!important}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="#10191e"/>
    <rect x="730" width="470" height="380" fill="url(#grid)"/>
    <circle cx="938" cy="204" r="225" fill="url(#halo)"/>
    <path d="M48 76H690M744 32V348" stroke="#334047"/>
    <text x="48" y="49" fill="#dfab88" class="mono" font-size="15" letter-spacing="2.4">RE / INDEPENDENT SYSTEMS LAB</text>
    <circle cx="682" cy="44" r="4" fill="#a5ddce" class="pulse"/>
    <text x="44" y="170" fill="#f0eee7" class="sans" font-weight="700" font-size="96" letter-spacing="-5">REPO</text>
    <text x="44" y="267" fill="#f0eee7" class="sans" font-weight="700" font-size="96" letter-spacing="-5">ENJOYER<tspan fill="#dfab88">.</tspan></text>
    <text x="49" y="315" fill="#c3c9c8" class="sans" font-size="21">Find the hidden mechanism.</text>
    <text x="49" y="344" fill="#c3c9c8" class="sans" font-size="21">Build something useful.</text>
    <g fill="none">
      <circle cx="938" cy="204" r="148" stroke="#40575a"/>
      <circle cx="938" cy="204" r="117" stroke="#40575a" stroke-dasharray="2 8"/>
      <circle cx="938" cy="204" r="83" stroke="#55706e"/>
      <path d="M768 204H810M1066 204H1108M938 34V77M938 331V374" stroke="#6d8382"/>
      <g class="orbit">
        <circle cx="938" cy="204" r="148" stroke="#a5ddce" stroke-width="2" stroke-dasharray="110 820"/>
        <circle cx="1086" cy="204" r="6" fill="#a5ddce" stroke="#10191e" stroke-width="2"/>
        <circle cx="790" cy="204" r="3" fill="#dfab88"/>
      </g>
      <g class="reverse">
        <ellipse cx="938" cy="204" rx="171" ry="55" stroke="#dfab88" stroke-opacity=".65" transform="rotate(-35 938 204)"/>
        <circle cx="1078" cy="106" r="4" fill="#dfab88"/>
      </g>
      <path d="M938 120 1011 162V246L938 288 865 246V162Z" stroke="#a5ddce" stroke-width="1.5"/>
      <path d="M865 162 938 204 1011 162M938 204V288M938 120V158M865 246 900 226M1011 246 976 226" stroke="#a5ddce" stroke-opacity=".65"/>
      <path d="M865 162 938 204 1011 162" stroke="#f0eee7" stroke-width="2" class="signal"/>
    </g>
    <path d="M938 178 961 191V218L938 231 915 218V191Z" fill="#10191e" stroke="#dfab88"/>
    <circle cx="938" cy="204" r="5" fill="#dfab88" class="pulse"/>
    <text x="791" y="48" class="mono" fill="#9fbbb5" font-size="11" letter-spacing="2">FIG. 01 / UNDER THE SURFACE</text>
    <rect y="386" width="1200" height="54" fill="#1a272d"/>
    <path d="M0 386H1200" stroke="#405054"/>
    <text x="48" y="419" class="mono" fill="#b5c8c3" font-size="14" letter-spacing="1.5">TOOLS / SYSTEMS / OPEN KNOWLEDGE</text>
    <text x="1150" y="419" text-anchor="end" class="mono" fill="#dfab88" font-size="14" letter-spacing="1.5">A QUESTION IS A GOOD START.</text>
  </g>
</svg>
